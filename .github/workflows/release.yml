name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust_targets: aarch64-apple-darwin
            bundle_dir: src-tauri/target/aarch64-apple-darwin/release/bundle
            os: macos
            arch: arm64

          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust_targets: x86_64-apple-darwin
            bundle_dir: src-tauri/target/x86_64-apple-darwin/release/bundle
            os: macos
            arch: x64

          - platform: windows-latest
            args: ''
            rust_targets: ''
            bundle_dir: src-tauri/target/release/bundle
            os: windows
            arch: x64

          - platform: ubuntu-22.04
            args: ''
            rust_targets: ''
            bundle_dir: src-tauri/target/release/bundle
            os: linux
            arch: x64

    runs-on: ${{ matrix.platform }}

    steps:
      # Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # Linux dependencies
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            libssl-dev \
            libdbus-1-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      # Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Rust
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      # Rust cache
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      # Frontend dependencies
      - name: Install frontend dependencies
        run: npm ci

      # Resolve Tauri tools cache directory (holds NSIS + WiX downloads)
      - name: Resolve Tauri tools cache directory
        if: matrix.platform == 'windows-latest'
        id: tauri-cache
        shell: pwsh
        run: |
          $cachePath = Join-Path $env:LOCALAPPDATA "tauri"

          "path=$cachePath" >> $env:GITHUB_OUTPUT

          Write-Host "Tauri tools cache directory: $cachePath"

      # Restore Tauri tools cache
      - name: Restore Tauri tools cache
        if: matrix.platform == 'windows-latest'
        id: tools-cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.tauri-cache.outputs.path }}
          key: tauri-tools-nsis-3.13-wix314-windows-x64-v2

      # Pre-download NSIS with retries so a transient GitHub 5xx doesn't fail the bundle
      - name: Pre-download NSIS
        if: matrix.platform == 'windows-latest' && steps.tools-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $toolsDir = "${{ steps.tauri-cache.outputs.path }}"
          $nsisDir = Join-Path $toolsDir "NSIS"
          $zip = Join-Path $env:RUNNER_TEMP "nsis-3.13.zip"
          $url = "https://github.com/tauri-apps/binary-releases/releases/download/nsis-3.13/nsis-3.13.zip"

          if (Test-Path (Join-Path $nsisDir "makensis.exe")) {
            Write-Host "NSIS already present."
            exit 0
          }

          New-Item -ItemType Directory -Force -Path $toolsDir | Out-Null

          $ok = $false
          for ($i = 1; $i -le 6; $i++) {
            try {
              Write-Host "Downloading NSIS (attempt $i)..."
              Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
              $ok = $true
              break
            }
            catch {
              Write-Warning "Attempt $i failed: $($_.Exception.Message)"
              Start-Sleep -Seconds (15 * $i)
            }
          }

          if (-not $ok) {
            Write-Warning "Could not pre-download NSIS; Tauri will try itself."
            exit 0
          }

          $extract = Join-Path $env:RUNNER_TEMP "nsis-extract"
          Expand-Archive -Path $zip -DestinationPath $extract -Force
          $inner = Get-ChildItem -Path $extract -Directory | Select-Object -First 1
          if (Test-Path $nsisDir) { Remove-Item -Recurse -Force $nsisDir }
          Move-Item -Path $inner.FullName -Destination $nsisDir
          Write-Host "NSIS installed to $nsisDir"

      # Apple signing
      - name: Configure Apple signing
        if: startsWith(matrix.platform, 'macos')
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ] && \
             [ -n "$APPLE_CERTIFICATE_PASSWORD" ] && \
             [ -n "$APPLE_SIGNING_IDENTITY" ]; then

            {
              echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE"
              echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD"
              echo "APPLE_SIGNING_IDENTITY=$APPLE_SIGNING_IDENTITY"
            } >> "$GITHUB_ENV"

            if [ -n "$APPLE_ID" ] && \
               [ -n "$APPLE_PASSWORD" ] && \
               [ -n "$APPLE_TEAM_ID" ]; then

              {
                echo "APPLE_ID=$APPLE_ID"
                echo "APPLE_PASSWORD=$APPLE_PASSWORD"
                echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
              } >> "$GITHUB_ENV"
            fi

            echo "Developer ID signing enabled."
          else
            echo "No Apple certificate configured; using ad-hoc signing."
          fi

      # Build and create GitHub release (retried to survive transient download errors)
      - name: Build Tauri application
        id: tauri
        continue-on-error: true
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "Zorvilo ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}"
          releaseBody: |
            Download the installer for your platform from **Assets** below.

            | Platform | File |
            | --- | --- |
            | macOS (Apple Silicon) | `Zorvilo-macos-arm64.dmg` |
            | macOS (Intel) | `Zorvilo-macos-x64.dmg` |
            | Windows | `Zorvilo-windows-x64-setup.exe` (or `.msi`) |
            | Linux | `Zorvilo-linux-x64.AppImage`, `.deb` or `.rpm` |

            **macOS:** if macOS says the app can't be opened, right-click Zorvilo in Applications and choose Open, or run `xattr -cr /Applications/Zorvilo.app`.

            **Windows:** if SmartScreen appears, click More info → Run anyway.

            **Linux (AppImage):** run `chmod +x Zorvilo-linux-x64.AppImage` and launch it.

          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Wait before retry
        if: steps.tauri.outcome == 'failure'
        shell: bash
        run: sleep 60

      - name: Build Tauri application (retry 1)
        id: tauri_retry1
        if: steps.tauri.outcome == 'failure'
        continue-on-error: true
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "Zorvilo ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}"
          releaseBody: |
            Download the installer for your platform from **Assets** below.

            | Platform | File |
            | --- | --- |
            | macOS (Apple Silicon) | `Zorvilo-macos-arm64.dmg` |
            | macOS (Intel) | `Zorvilo-macos-x64.dmg` |
            | Windows | `Zorvilo-windows-x64-setup.exe` (or `.msi`) |
            | Linux | `Zorvilo-linux-x64.AppImage`, `.deb` or `.rpm` |

            **macOS:** if macOS says the app can't be opened, right-click Zorvilo in Applications and choose Open, or run `xattr -cr /Applications/Zorvilo.app`.

            **Windows:** if SmartScreen appears, click More info → Run anyway.

            **Linux (AppImage):** run `chmod +x Zorvilo-linux-x64.AppImage` and launch it.

          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      - name: Wait before final retry
        if: steps.tauri.outcome == 'failure' && steps.tauri_retry1.outcome == 'failure'
        shell: bash
        run: sleep 120

      - name: Build Tauri application (retry 2)
        id: tauri_retry2
        if: steps.tauri.outcome == 'failure' && steps.tauri_retry1.outcome == 'failure'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: "Zorvilo ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}"
          releaseBody: |
            Download the installer for your platform from **Assets** below.

            | Platform | File |
            | --- | --- |
            | macOS (Apple Silicon) | `Zorvilo-macos-arm64.dmg` |
            | macOS (Intel) | `Zorvilo-macos-x64.dmg` |
            | Windows | `Zorvilo-windows-x64-setup.exe` (or `.msi`) |
            | Linux | `Zorvilo-linux-x64.AppImage`, `.deb` or `.rpm` |

            **macOS:** if macOS says the app can't be opened, right-click Zorvilo in Applications and choose Open, or run `xattr -cr /Applications/Zorvilo.app`.

            **Windows:** if SmartScreen appears, click More info → Run anyway.

            **Linux (AppImage):** run `chmod +x Zorvilo-linux-x64.AppImage` and launch it.

          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

      # Upload stable-named installers
      - name: Upload stable-named installers
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('v{0}', steps.tauri.outputs.appVersion || steps.tauri_retry1.outputs.appVersion || steps.tauri_retry2.outputs.appVersion) }}
          BUNDLE: ${{ matrix.bundle_dir }}
          PREFIX: Zorvilo-${{ matrix.os }}-${{ matrix.arch }}

        run: |
          set -euo pipefail

          shopt -s nullglob

          out="$RUNNER_TEMP/stable"
          mkdir -p "$out"

          copy() {
            local pattern="$1"
            local destination="$2"

            local files=( $pattern )

            if [ ${#files[@]} -gt 0 ]; then
              cp "${files[0]}" "$out/$destination"
              echo "Prepared $destination"
            fi
          }

          # macOS
          copy "$BUNDLE/dmg/*.dmg" \
            "$PREFIX.dmg"

          # Windows NSIS
          copy "$BUNDLE/nsis/*-setup.exe" \
            "$PREFIX-setup.exe"

          # Windows MSI
          copy "$BUNDLE/msi/*.msi" \
            "$PREFIX.msi"

          # Linux AppImage
          copy "$BUNDLE/appimage/*.AppImage" \
            "$PREFIX.AppImage"

          # Linux DEB
          copy "$BUNDLE/deb/*.deb" \
            "$PREFIX.deb"

          # Linux RPM
          copy "$BUNDLE/rpm/*.rpm" \
            "$PREFIX.rpm"

          files=("$out"/*)

          if [ ${#files[@]} -eq 0 ]; then
            echo "No installers found in $BUNDLE" >&2
            exit 1
          fi

          echo "Uploading stable-named installers..."

          gh release upload "$TAG" "${files[@]}" \
            --clobber \
            --repo "$GITHUB_REPOSITORY"
